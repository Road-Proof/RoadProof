name: Enforce PR sources

on:
  pull_request:
    branches: [main, dev]

jobs:
  check-source:
    if: github.repository == 'Road-Proof/RoadProof'
    runs-on: ubuntu-latest
    steps:
      - name: Validar origen del PR
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "Solo se permiten PRs desde dev hacia main"
            exit 1
          fi
          if [ "$BASE_REF" = "dev" ] && [ "$IS_FORK" != "true" ]; then
            echo "Solo se permiten PRs desde forks hacia dev"
            exit 1
          fi

